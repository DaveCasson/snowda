case_name: ross_summa_esp_no_da
description: >
  Ross River open-loop SUMMA ensemble, then ESP traces.
  Forecasts are issued on 1 March, 1 April, and 1 May and are initialised
  from the historic ensemble members. Run with snowda.workflows.run_summa_esp.

#output_dir: /Users/dcasson/GitHub/snowda/outputs/ross_summa_esp
log_file: logs/ross_summa_esp_no_da.log

model_run_id: ross_summa_esp_no_da
base_file_manager: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/fileManager.txt
ensemble_forcing_mode: historic
ensemble_forcing_dir: /anvil/projects/x-ees240082/users/dcasson/gpep/yrb/prod_complete/prod_complete/ross_summa/forcing
num_ens: 44
num_workers: 50

start_time: "1980-01-01 00:00"
end_time: "1990-08-01 00:00"
time_delta_days: 1

summa_exe: /home/x-dcasson/GitRepos/summa/bin/summa_sundials.exe
summa_log: false


# Daily restarts so a state file exists at each forecast issue date.
summa_args:
  "-m": /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/fileManager.txt
  "-r": e

# Settings directory for the base file manager and forcing file lists.
# Generated fileManagerEns*.txt files are written into the run directory.
file_manager_dir: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/
file_list_dir: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/

# SUMMA writes 001_YYYY_MM_DD_timestep.nc under <run_dir>/summa.
summa_output_suffix: timestep.nc

