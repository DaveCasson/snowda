case_name: ross_esp_streamflow_eval
description: ESP streamflow evaluation for Ross River (ensemble traces vs gauge CSV).

output_dir: /Users/dcasson/GitHub/snowda/outputs/ross_esp_streamflow_eval

run_dir: /Users/dcasson/GitHub/snowda/outputs/ross_summa_esp/20261022T225336Z
obs_csv: /Users/dcasson/Data/snowda/summa/ross_lumped/observations/streamflow.csv
thresholds_csv: /Users/dcasson/Data/snowda/summa/ross_lumped/thresholds/ross_thresholds.csv

variable: IRFroutedRunoff
resample: 1D
seg: 0

return_periods: [5, 10, 20]
event_probability_threshold: 0.5
exclude_verification_year: true
crps_method: fair
fair_brier: true
# One CRPS and one CRPSS per forecast for the maximum discharge over the horizon,
# referenced to observed peaks in the same calendar window of other years.
score_peak: true
# One CRPS and one CRPSS per forecast for total water volume over the paired days.
score_volume: true
# Circular block bootstrap of initialization time. Intervals are 90% bounds
# on the initiation-month mean. Set bootstrap_iterations to 0 to skip them.
bootstrap_iterations: 100
bootstrap_block_size: 2
bootstrap_circular: true
bootstrap_ci_level: 0.9
bootstrap_seed: 0
