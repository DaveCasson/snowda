case_name: ross_summa_esp
description: >
  Ross River open-loop SUMMA ensemble, then ESP traces.
  Forecasts are issued on 1 March, 1 April, and 1 May and are initialised
  from the historic ensemble members. Run with snowda.workflows.run_summa_esp.

#output_dir: /Users/dcasson/GitHub/snowda/outputs/ross_summa_esp
log_file: logs/ross_summa_esp.log

model_run_id: ross_summa_esp
base_file_manager: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA/fileManager.txt
forcing_file_base: /Users/dcasson/Data/snowda/summa/ross_lumped/forcing/Ross_
ensemble_forcing_mode: historic
ensemble_forcing_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/forcing/ensemble
num_ens: 10
num_workers: 10

start_time: "2010-02-01 00:00"
end_time: "2020-08-01 00:00"
time_delta_days: 1

summa_exe: /Users/dcasson/GitHub/summa/bin/summa.exe
summa_log: false


# Daily restarts so a state file exists at each forecast issue date.
summa_args:
  "-m": /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA/fileManager.txt
  "-r": d

file_manager_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA
file_list_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA

# SUMMA writes 001_YYYY_MM_DD_timestep.nc under <run_dir>/summa.
summa_output_suffix: timestep.nc

esp:
  start_year: 2010  
  end_year: 2020
  forecast_end: "08-01"
  n_members: 10
  seed: 20270101
  dates: &forecast_dates
    # 1 March, 1 April, and 1 May. Dates before start_time are skipped.
