case_name: chena_summa_deterministic
description: Deterministic SUMMA run for chena River (no DA, no ESP).

# Outputs go to <output_dir>/<run_name>/. run_name: timestamp (default) makes a new
# UTC-timestamped folder per run; any other name uses that fixed folder (re-runs overwrite).
output_dir: ../../outputs/chena_summa_deterministic
run_name: timestamp
log_file: logs/chena_summa_deterministic.log

model_run_id: chena_summa_deterministic
base_file_manager: /Users/dcasson/GitHub/snowda/models/chena_lumped/SUMMA/fileManagerEnsMean.txt
forcing_file_base: /Users/dcasson/Data/snowda/summa/chena_lumped/forcing/mean/chena
num_ens: 1

start_time: "1980-01-01 00:00"
end_time: "2024-12-29 00:00"
time_delta_days: 1

summa_exe: /Users/dcasson/GitHub/summa/bin/summa.exe
summa_log: false

summa_args:
  "-m": /Users/dcasson/GitHub/snowda/models/chena_lumped/SUMMA/fileManagerEnsMean.txt
  "-r": m

file_manager_dir: /Users/dcasson/Data/snowda/summa/chena_lumped/settings/SUMMA
file_list_dir: /Users/dcasson/Data/snowda/summa/chena_lumped/settings/SUMMA

mizuroute:
  executable: /Users/dcasson/GitHub/mizuRoute/route/bin/route_runoff.exe
  control_file: /Users/dcasson/Data/snowda/summa/chena_lumped/settings/mizuRoute/mizuroute.control
  ancil_dir: /Users/dcasson/Data/snowda/summa/chena_lumped/settings/mizuRoute/
  case_name: chena
  restart_write: never
  log_output: false

evaluation:
  obs_csv: /Users/dcasson/GitHub/snowda/data/chena_daily_discharge.csv
  variable: IRFroutedRunoff
  resample: 1D
  seg: 0

