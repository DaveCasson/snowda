assimilation:
  dates: *forecast_dates
  obs_window_days: 15
  # Model-equivalent SWE from data/yukon_snow_data.csv. station_id is location_code.
  swe_nc: /Users/dcasson/GitHub/snowda/outputs/obs_qm/ross_yukon_swe_model_equivalent.nc
  swe_var: swe_model_equivalent
  summa_swe_var: scalarSWE
  # Manual pairing. Ross lumped SUMMA hruId is 1. Stations not listed are ignored.
  # Several stations may share one HRU; their usable samples are averaged.
  # 09BA-SC02 is the Twin Creeks composite of 09BA-SC02A and 09BA-SC02B.
  # List the composite or the parts, not both.
  hru_stations:
    - hru_id: 1
      station_id: "09BA-SC02"
  z_var: 0.10
