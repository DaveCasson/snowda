case_name: ross_summa_historic_da
description: >
  Historic SUMMA assimilation for Ross River. Ensemble members keep their own
  forcing. At each assimilation date, SIR copies the donor SUMMA restart and
  the matching mizuRoute restart. mizuRoute then routes the next SUMMA
  segment from that particle. No ESP.

# Outputs go to <output_dir>/<run_name>/. run_name: timestamp (default) makes a new
# UTC-timestamped folder per run; any other name uses that fixed folder (re-runs overwrite).
output_dir: /Users/dcasson/GitHub/snowda/outputs/ross_summa_historic_da
run_name: timestamp
log_file: logs/ross_summa_historic_da.log

model_run_id: ross_summa_historic_da
base_file_manager: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA/fileManager.txt
forcing_file_base: /Users/dcasson/Data/snowda/summa/ross_lumped/forcing/Ross_
ensemble_forcing_mode: historic
ensemble_forcing_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/forcing/ensemble
num_ens: 50
num_workers: 10

start_time: "2012-08-01 00:00"
end_time: "2014-08-01 00:00"
time_delta_days: 1

summa_exe: /Users/dcasson/GitHub/summa/bin/summa.exe
summa_log: false

pf_scheme: sir
n_eff_threshold: 0.5
# Limit collapse per update: keep N_eff >= 0.5 * prior N_eff. Guards against
# sigma_o being a lower bound and station error persisting across dates.
tempering_target: 0.5
# Seed for SIR resampling. Each assimilation date gets its own stream.
pf_seed: 42
# Weights reset to equal at the first update of each water year (1 October).
season_start_month: 10
assimilation_mode: swe

# Daily restarts so a state file exists at each assimilation date.
summa_args:
  "-m": /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA/fileManager.txt
  "-r": d

assimilation:
  dates:
    - "2014-02-01 00:00"
    - "2014-03-01 00:00"
    - "2014-04-01 00:00"
    - "2014-05-01 00:00"
  # Surveys fall on the 24th-31st. +/-7 days keeps 126 of 132 samples and cuts
  # timing error from 25 to 11 kg m-2 (scripts/swe_error_budget.py).
  obs_window_days: 7
  # Model-equivalent SWE from data/yukon_snow_data.csv. station_id is location_code.
  swe_nc: /Users/dcasson/GitHub/snowda/data/obs_qm/ross_yukon_swe_model_equivalent.nc
  swe_var: swe_model_equivalent
  summa_swe_var: scalarSWE
  # Manual pairing. Ross lumped SUMMA hruId is 1. Stations not listed are ignored.
  # Several stations may share one HRU; their usable samples are averaged.
  # 09BA-SC02 is the Twin Creeks composite of 09BA-SC02A and 09BA-SC02B.
  # List the composite or the parts, not both.
  hru_stations:
    - hru_id: 1
      station_id: "09BA-SC02"
  # One standard deviation is this fraction of |observed SWE|.
  swe_relative_uncertainty: 0.15
  # Absolute standard-deviation floor, kg m-2. sigma is never smaller than this.
  # sqrt(sigma_o^2 + sigma_t^2) = sqrt(35^2 + 11^2) for one station at +/-7 days.
  # sigma_o = 35 is a lower bound from the spread across stations within a campaign.
  swe_sigma_floor: 37

# Settings directory for the base file manager and forcing file lists.
# Generated fileManagerEns*.txt files are written into the run directory.
file_manager_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA
file_list_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/SUMMA

# SUMMA writes 001_YYYY_MM_DD_timestep.nc under <run_dir>/summa.
# mizuRoute writes 001_YYYY_MM_DD_mizuroute.nc under <run_dir>/mizuroute.
summa_output_suffix: timestep.nc

mizuroute:
  executable: /Users/dcasson/GitHub/mizuRoute/route/bin/route_runoff.exe
  control_file: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/mizuRoute/mizuroute.control
  ancil_dir: /Users/dcasson/Data/snowda/summa/ross_lumped/settings/mizuRoute/
  case_name: Ross
  restart_write: monthly
  log_output: false
