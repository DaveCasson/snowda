# Ross River comparison set (Anvil): esp_sir
# Submit with: shell_scripts/run_case.sh runs/ross_comparison_anvil/esp_sir.yaml
# Generated from runs/ross_comparison; see runs/ross_comparison/README.md for what must stay identical between files.
case_name: ross_esp_sir
run_mode: esp_sir
description: >
  SWE assimilation by SIR, then ESP forecasts. Members are resampled when N_eff falls to the threshold, and the resampled states carry forward.
output_dir: /anvil/scratch/x-dcasson/snowda/outputs/ross_comparison/esp_sir
run_name: timestamp
log_file: logs/esp_sir.log
model_run_id: ross_esp_sir

start_time: "1980-08-01 00:00"
end_time: "2024-08-01 00:00"
time_delta_days: 1
summa_exe: /home/x-dcasson/GitRepos/summa/bin/summa_sundials.exe
summa_log: false
base_file_manager: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/fileManagerANVIL.txt
ensemble_forcing_mode: historic
ensemble_forcing_dir: /anvil/projects/x-ees240082/users/dcasson/gpep/yrb/prod_complete/prod_complete/ross_summa/forcing
num_ens: 50
num_workers: 50
file_manager_dir: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/
file_list_dir: /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/
summa_output_suffix: timestep.nc
summa_args:
  "-m": /home/x-dcasson/GitRepos/snowda/models/ross_lumped/SUMMA/fileManagerANVIL.txt
  "-r": m

# ---- Particle filter: identical in the SIS and SIR files; run_mode sets the scheme ----
n_eff_threshold: 0.5      # SIR resamples when N_eff <= 0.5 N; SIS never resamples
tempering_target: 0.5
pf_seed: 42
season_start_month: 10    # weights reset to equal each 1 October
assimilation_mode: swe

